services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --http-port 9080
    environment:
      KC_BOOTSTRAP_ADMIN_USERS: admin
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME: localhost
      KC_HTTP_HOST: 0.0.0.0
    ports:
      - "9080:9080"
    volumes:
      - ./keycloak-init:/opt/keycloak/init
    entrypoint: ["/opt/keycloak/init/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/"]
      interval: 30s
      timeout: 10s
      retries: 10
  backend:
    build: .
    ports:
      - "7080:7080"
    environment:
      - PORT=7080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=attendance
      - DB_PASSWORD=attendance
      - DB_NAME=attendance
      - KEYCLOAK_URL=http://keycloak:9080
      - KEYCLOAK_REALM=attendance-management
      - KEYCLOAK_CLIENT_ID=attendance-app
      - KEYCLOAK_CLIENT_SECRET=
    depends_on:
      - postgres
      - keycloak
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - webapp
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
